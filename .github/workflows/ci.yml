name: CI

on:
  pull_request:
  push:
    branches:
      - beta
      - master
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    # Name must match beta branch protection required check.
    name: PHP lint + smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/components/minishop3

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ms3_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      MS3_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=ms3_test;charset=utf8mb4
      MS3_TEST_MYSQL_USER: root
      MS3_TEST_MYSQL_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: pdo_mysql
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check + smoke + PHPUnit
        run: composer ci:php

  modx-testbench:
    name: MODX testbench (${{ matrix.modx }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core/components/minishop3
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2']
        modx: ['3.1.2-pl', '3.2.3-pl', '3.2.4-pl']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: modx_testbench
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      MODX_TESTBENCH_VERSION: ${{ matrix.modx }}
      MODX_TESTBENCH_DB_HOST: 127.0.0.1
      MODX_TESTBENCH_DB_PORT: 3306
      MODX_TESTBENCH_DB_NAME: modx_testbench
      MODX_TESTBENCH_DB_USER: root
      MODX_TESTBENCH_DB_PASS: root

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_mysql, zip, gd
          tools: composer:v2

      - name: Cache testbench MODX releases
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/modx-testbench/releases
          key: testbench-releases-${{ matrix.modx }}-${{ runner.os }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install MODX testbench environment
        run: vendor/bin/modx-testbench install

      - name: Live MODX PHPUnit
        run: composer test:modx

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/components/minishop3

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Cache PHPStan dependency trees
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .phpstan-deps
          key: phpstan-deps-v2-${{ runner.os }}-${{ hashFiles('core/components/minishop3/scripts/phpstan-deps.pins') }}

      - name: Prepare MODX / pdoTools for analysis
        run: composer stan:prepare

      - name: PHPStan
        run: composer stan

  vue:
    name: vueManager lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vueManager

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vueManager/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint (vueManager)
        run: npm run lint:ci

      - name: ESLint (storefront js/web)
        run: npm run lint:storefront

      - name: Vitest
        run: npm test

      - name: Smoke tests
        run: npm run test:smoke
